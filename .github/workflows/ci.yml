name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # CI — continuous integration (compile + test + production build check)
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Update Compact compiler
        run: |
          compact update
          compact --version
          compact compile --version

      - name: npm install
        run: npm install

      - name: Compact compile
        run: |
          compact compile contracts/counter.compact contracts/managed/counter
          mkdir -p managed
          rm -rf managed/counter
          ln -sfn ../contracts/managed/counter managed/counter
          test -f contracts/managed/counter/contract/index.js
          test -e managed/counter

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # CD — continuous deployment to GitHub Pages (runs after CI on main)
  # ---------------------------------------------------------------------------
  cd:
    name: CD
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /Degree_Verification-_Portal/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # CD (Vercel) — optional production deploy when Vercel secrets are configured
  # ---------------------------------------------------------------------------
  cd-vercel:
    name: CD (Vercel)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel secrets
        id: vercel-ready
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets not configured — skipping optional Vercel deploy."
          fi

      - name: Checkout code
        if: steps.vercel-ready.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Install Node.js v22
        if: steps.vercel-ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        if: steps.vercel-ready.outputs.ready == 'true'
        run: npm install

      - name: Install Vercel CLI
        if: steps.vercel-ready.outputs.ready == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        if: steps.vercel-ready.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        if: steps.vercel-ready.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        if: steps.vercel-ready.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
